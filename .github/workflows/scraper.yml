name: Scraper Telegram -> Discord

on:
  schedule:
    # Roda todo início de hora, no minuto 5 (horário UTC): 00:05, 01:05...
    # Evitar o minuto 0 é importante: é o horário de pico de todos os
    # workflows agendados do GitHub rodando ao mesmo tempo, causando
    # atrasos grandes ou execuções puladas. Minutos "quebrados" (5, 12,
    # 23...) sofrem bem menos disso.
    - cron: "5 * * * *"
  # Permite disparar manualmente pela aba "Actions" no GitHub, para testar
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o scraper (1 ciclo)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_USERNAME: ${{ secrets.DISCORD_WEBHOOK_USERNAME }}
        run: python telegram_public_scraper.py --once
